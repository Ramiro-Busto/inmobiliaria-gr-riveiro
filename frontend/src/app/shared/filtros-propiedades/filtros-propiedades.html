<form class="filtros" [formGroup]="form" (ngSubmit)="emitirBusqueda()">
  <label>
    Tipo
    <select formControlName="tipo">
      <option value="">Todos</option>
      @for (tipo of TIPOS_PROPIEDAD; track tipo) {
        <option [value]="tipo">{{ TIPO_LABELS[tipo] }}</option>
      }
    </select>
  </label>

  <label>
    Operación
    <select formControlName="operacion">
      <option value="">Todas</option>
      @for (operacion of OPERACIONES; track operacion) {
        <option [value]="operacion">{{ etiquetaOpcion(operacion) }}</option>
      }
    </select>
  </label>

  <label>
    Ubicación
    <input type="text" formControlName="ubicacion" placeholder="Barrio, localidad..." />
  </label>

  <label>
    Precio mín.
    <input type="number" formControlName="precioMin" />
  </label>

  <label>
    Precio máx.
    <input type="number" formControlName="precioMax" />
  </label>

  <div class="filtros__botones">
    <button type="submit">Buscar</button>
    <button type="button" (click)="limpiar()">Limpiar</button>
  </div>
</form>
