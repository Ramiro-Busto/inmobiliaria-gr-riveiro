<nav class="navbar">
  <a routerLink="/" class="navbar__brand" (click)="cerrarMenu()">
    <img src="/logo-gr-riveiro.png" alt="GR Riveiro Negocios Inmobiliarios" />
  </a>

  <button
    type="button"
    class="navbar__hamburguesa"
    (click)="alternarMenu()"
    [attr.aria-expanded]="menuAbierto()"
    aria-label="Abrir menú"
  >
    <app-icon [name]="menuAbierto() ? 'close' : 'menu'" [size]="24" />
  </button>

  <div class="navbar__panel" [class.is-abierto]="menuAbierto()">
    <div class="navbar__links">
      <a
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="cerrarMenu()"
        >Inicio</a
      >
      <a routerLink="/propiedades" routerLinkActive="is-active" (click)="cerrarMenu()">Propiedades</a>
      <a routerLink="/la-empresa" routerLinkActive="is-active" (click)="cerrarMenu()">La Empresa</a>
      <a routerLink="/tasaciones" routerLinkActive="is-active" (click)="cerrarMenu()">Tasaciones</a>
      <a routerLink="/contacto" routerLinkActive="is-active" (click)="cerrarMenu()">Contacto</a>
    </div>

    <div class="navbar__redes">
      <a [href]="instagramUrl" target="_blank" rel="noopener" aria-label="Instagram">
        <app-icon name="instagram" [size]="20" />
      </a>
      <a [href]="facebookUrl" target="_blank" rel="noopener" aria-label="Facebook">
        <app-icon name="facebook" [size]="20" />
      </a>
    </div>
  </div>
</nav>
